<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Producer Console</title>
    <style>
        :root {
            --bg:#0e1420; --panel:#161e2e; --panel-2:#1b2436; --line:#26324a;
            --ink:#cdd8e8; --muted:#73839c; --accent:#f5a623; --hit:#37d3b0;
            --danger:#ef6f6c;
            --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,monospace;
            --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh}
        .topbar{display:flex;align-items:center;gap:.75rem;padding:.9rem 1.4rem;border-bottom:1px solid var(--line)}
        .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #f5a62322,0 0 12px var(--accent);flex-shrink:0}
        .topbar h1{font-size:1.15rem;font-weight:650;letter-spacing:.2px}
        .topbar p{font-size:.8rem;color:var(--muted)}
        .instruments{display:flex;gap:.6rem;margin-left:auto;flex-wrap:wrap}
        .instr{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.35rem .75rem;min-width:80px}
        .instr-k{display:block;font-size:.66rem;color:var(--muted);letter-spacing:.5px}
        .instr-v{display:block;font-family:var(--mono);font-size:.9rem;font-weight:600;color:var(--accent)}
        main{padding:1.4rem;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:1.1rem}
        .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
        .card h2{font-size:1rem;font-weight:650;margin-bottom:.25rem}
        .hint{color:var(--muted);font-size:.82rem;margin-bottom:.9rem}
        .row{display:flex;gap:.5rem;margin-bottom:.9rem}
        input[type="text"]{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:.6rem .75rem;font-family:var(--mono);font-size:.9rem;flex:1;transition:.15s}
        input[type="text"]:focus{outline:none;border-color:var(--accent)}
        input[type="text"]::placeholder{color:var(--muted)}
        .btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:.6rem 1.1rem;cursor:pointer;font-family:var(--sans);font-size:.88rem;white-space:nowrap;transition:.15s}
        .btn:hover{border-color:var(--accent);color:#fff}
        .btn-primary{background:var(--accent);color:#13110a;border-color:var(--accent);font-weight:650}
        .btn-primary:hover{filter:brightness(1.08);color:#13110a}
        .btn-valid{border-color:var(--hit);color:var(--hit)}
        .btn-valid:hover{background:#37d3b01a;color:var(--hit)}
        .btn-poison{border-color:var(--danger);color:var(--danger)}
        .btn-poison:hover{background:#ef6f6c1a;color:var(--danger)}
        .quick{display:flex;gap:.5rem;padding-top:.9rem;border-top:1px solid var(--line)}
        .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem}
        #log{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;height:280px;overflow-y:auto;font-family:var(--mono);font-size:.82rem;display:flex;flex-direction:column;gap:.3rem;margin-top:.75rem}
        #log::-webkit-scrollbar{width:6px}
        #log::-webkit-scrollbar-track{background:transparent}
        #log::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
        .log-entry{color:var(--hit)}
        .log-entry .ts{color:var(--muted);margin-right:.4rem}
        .log-entry .label{color:var(--accent);margin-right:.35rem}
        .log-empty{color:var(--muted);font-style:italic}
    </style>
    <script src="config.js"></script>
</head>
<body>
<header class="topbar">
    <span class="dot"></span>
    <div>
        <h1>Message Producer Console</h1>
        <p>Enqueue messages into the processing pipeline</p>
    </div>
    <div class="instruments">
        <div class="instr"><span class="instr-k">SENT</span><span class="instr-v" id="cntSent">0</span></div>
    </div>
</header>
<main>
    <div class="card">
        <h2>Send Custom Message</h2>
        <p class="hint">Type a payload and press Send or hit Enter. Append <code style="color:var(--accent)">:fail</code> to simulate a poison message.</p>
        <div class="row">
            <input type="text" id="customPayload" placeholder="Type your message payload…" />
            <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>
        <div class="quick">
            <button class="btn btn-valid" id="quickValid">↯ Valid Package</button>
            <button class="btn btn-poison" id="quickPoison">✕ Poison Package</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Transmission Log</h2>
            <span style="font-family:var(--mono);font-size:.8rem;color:var(--muted)" id="logMeta">0 messages</span>
        </div>
        <p class="hint">Outbound events from this session</p>
        <div id="log"><span class="log-empty">No messages sent yet.</span></div>
    </div>
</main>

<script>
    let sentCount = 0;

    function logEntry(payload) {
        const logDiv = document.getElementById('log');
        const empty = logDiv.querySelector('.log-empty');
        if (empty) empty.remove();
        sentCount++;
        const ts = new Date().toLocaleTimeString('en-US', {hour12: false});
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerHTML = `<span class="ts">${ts}</span><span class="label">SENT</span>${payload}`;
        logDiv.appendChild(div);
        logDiv.scrollTop = logDiv.scrollHeight;
        document.getElementById('cntSent').textContent = sentCount;
        document.getElementById('logMeta').textContent = sentCount + ' message' + (sentCount === 1 ? '' : 's');
    }

    async function sendMessage(payload) {
        try {
            const res = await fetch((window.BASE_URL || '') + '/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({payload})
            });
            const data = await res.json();
            logEntry(data.payload);
        } catch(err) {
            console.error('Failed to send message', err);
        }
    }

    function sendCustom() {
        const input = document.getElementById('customPayload');
        const val = input.value.trim();
        if (!val) return;
        sendMessage(val);
        input.value = '';
    }

    document.getElementById('sendBtn').addEventListener('click', sendCustom);
    document.getElementById('customPayload').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendCustom();
    });
    document.getElementById('quickValid').addEventListener('click', () =>
        sendMessage('Package-' + Math.floor(Math.random() * 1000))
    );
    document.getElementById('quickPoison').addEventListener('click', () =>
        sendMessage('Package-' + Math.floor(Math.random() * 1000) + ':fail')
    );
</script>
</body>
</html>
