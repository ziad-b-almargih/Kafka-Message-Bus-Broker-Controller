services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-server
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for Kafka to be ready...' &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic warehouse-processing-lane --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic warehouse-dead-letter-queue --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 &&
      echo 'Topics created successfully!'
      "

  producer:
    build:
      context: ./KafkaMessageMainProducer
      dockerfile: Dockerfile
    container_name: kafka-main-producer
    restart: unless-stopped
    ports:
      - "${PRODUCER_PORT:-7001}:8080"
    environment:
      - KAFKA_SERVER=kafka:29092
      - ASPNETCORE_APPLICATIONNAME=KafkaMessageMainProducer
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  consumer:
    build:
      context: ./KafkaMessageConsumer
      dockerfile: Dockerfile
    container_name: kafka-worker-consumer
    restart: unless-stopped
    ports:
      - "${CONSUMER_PORT:-7002}:8080"
    environment:
      - KAFKA_SERVER=kafka:29092
      - ASPNETCORE_APPLICATIONNAME=KafkaMessageConsumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
  dlq:
    build:
      context: ./KafkaMessageDlq
      dockerfile: Dockerfile
    container_name: kafka-dlq-manager
    restart: unless-stopped
    ports:
      - "${DLQ_PORT:-7003}:8080"
    environment:
      - KAFKA_SERVER=kafka:29092
      - ASPNETCORE_APPLICATIONNAME=KafkaMessageDlq
    depends_on:
      kafka-init:
        condition: service_completed_successfully
